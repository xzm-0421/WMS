mes:
  master-data-poll-enabled: true
  master-data-poll-ms: 1800000
  plan-poll-enabled: true
  plan-poll-ms: 60000
  sync-worker-ms: 10000
  health-check-ms: 10000
  health-fail-threshold: 3
  max-retry: 5
  queue-capacity: 10000
  default-over-receive-ratio: 0

wms:
  pda:
    list-fetch-limit: 200
    short-cache-ttl-seconds: 60
    # 必须同步等金蝶结果，PDA 才能当场提示成败；勿改为 true 除非另做轮询
    async-erp-sync: false
    scan-skip-kingdee-refresh: true
    detail-local-prefer-seconds: 120
    # PDA 应用更新：将 wgt/apk 放到 jar 同级 pda-update/，并提高 version-code
    app-update:
      enabled: true
      version-name: "1.0.5"
      version-code: 105
      force: false
      package-type: apk
      download-url: "/pda-update/wms-pda.apk"
      changelog: "修复在线更新误开 HBuilder 网页；改为应用内下载安装 APK"
