spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  config:
    import: optional:classpath:application-dev-local.yml
  datasource:
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    url: jdbc:sqlserver://${SQLSERVER_HOST:localhost}:${SQLSERVER_PORT:1433};databaseName=${SQLSERVER_DB:wms};encrypt=true;trustServerCertificate=true
    username: ${SQLSERVER_USER:wms_app}
    password: ${SQLSERVER_PASSWORD:Wms@123456}
  data:
    redis:
      host: localhost
      port: 6379
      password: redis123
      database: 0
  flyway:
    enabled: true
    locations: classpath:db/migration/sqlserver
    baseline-on-migrate: true

logging:
  level:
    com.wms: debug
    org.springframework.security: info

