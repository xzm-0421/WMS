spring:
  # 服务器无 Redis 时排除自动配置；验证码/PDA 短缓存会回落进程内存
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    url: jdbc:sqlserver://${SQLSERVER_HOST:localhost}:${SQLSERVER_PORT:1433};databaseName=${SQLSERVER_DB:wms};encrypt=true;trustServerCertificate=true
#    username: ${SQLSERVER_USER:sa}
#    password: ${SQLSERVER_PASSWORD:sa@2019}
    username: ${SQLSERVER_USER:wms}
    password: ${SQLSERVER_PASSWORD:dbUser$8088!Kd}
  flyway:
    enabled: true
    locations: classpath:db/migration/sqlserver
    baseline-on-migrate: true

wms:
  pda:
    list-fetch-limit: 200
    short-cache-ttl-seconds: 90
    # 必须同步等金蝶结果，PDA 才能当场提示成败；勿改为 true 除非另做轮询
    async-erp-sync: false
    scan-skip-kingdee-refresh: true
    detail-local-prefer-seconds: 120
    app-update:
      enabled: true
      # 须大于手机上已安装 APK 的 versionCode（见 wms-pda/src/manifest.json）才会提示更新
      version-name: "1.0.4"
      version-code: 104
      force: false
      package-type: apk
      # 相对站点根即可；PDA 会拼成 http://服务器:9980/pda-update/wms-pda.apk
      # 切勿在服务端写成 HBuilder/DCloud 地址；也勿让客户端用 openURL 打开相对路径
      # 文件放在「启动 jar 时的工作目录」下 pda-update/wms-pda.apk（与 jar 同级建 pda-update 文件夹）
      download-url: "/pda-update/wms-pda.apk"
      changelog: "修复在线更新误开 HBuilder 网页；改为应用内下载安装 APK"

logging:
  level:
    com.wms: info
    root: warn

