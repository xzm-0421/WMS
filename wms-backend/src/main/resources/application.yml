server:
  port: 9980
  servlet:
    context-path: /

spring:
  application:
    name: wms-backend
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

wms:
  jwt:
    secret: wms-jwt-secret-key-change-in-production-min-256-bits-required!!
    access-token-expire: 43200
    refresh-token-expire: 604800
  cors:
    allowed-origins: "*"
  barcode:
    archive:
      cleanup-enabled: true
      retention-days: 365
      max-records: 100000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn
