version: '3.8'

services:
  wms-api:
    build: ../wms-backend
    ports:
      - "9980:9980"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SQLSERVER_HOST: sqlserver
      SQLSERVER_PORT: 1433
      SQLSERVER_DB: wms
      SQLSERVER_USER: sa
      SQLSERVER_PASSWORD: ${SQLSERVER_SA_PASSWORD:-sa@2019}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      - sqlserver
      - redis
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:-sa@2019}
      MSSQL_PID: Developer
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    restart: unless-stopped

  nginx:
    image: nginx:1.24-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../wms-web/dist:/usr/share/nginx/html:ro
    depends_on:
      - wms-api
    restart: unless-stopped

volumes:
  sqlserver_data:
  redis_data:
